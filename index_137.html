let _tlDivChart=null,_tlTopicChart=null,_tlGradeChart=null,_tlScoreChart=null,_tlAiToolChart=null;
function _tlFiltered(){
  const bo=(document.getElementById('tl-an-bonbu')||{}).value||'';
  const tp=(document.getElementById('tl-an-topic')||{}).value||'';
  const gr=(document.getElementById('tl-an-grade')||{}).value||'';
  return TALENT_PEOPLE.filter(p=>{
    if(bo&&p.division!==bo)return false;
    if(tp&&tlTopicKey(p.topic)!==tp)return false;
    if(gr==='_'){if(p.grade)return false}else if(gr&&p.grade!==gr)return false;
    return true;
  });
}
function renderTalentAnalysis(){
  const boSel=document.getElementById('tl-an-bonbu');
  if(boSel&&boSel.options.length<=1)[...new Set(TALENT_PEOPLE.map(p=>p.division).filter(Boolean))].sort().forEach(b=>{const o=document.createElement('option');o.value=b;o.textContent=b;boSel.appendChild(o);});
  const tpSel=document.getElementById('tl-an-topic');
  if(tpSel&&tpSel.options.length<=1)[...new Set(TALENT_PEOPLE.map(p=>p.topic).filter(Boolean))].sort().forEach(t=>{const o=document.createElement('option');o.value=tlTopicKey(t);o.textContent=tlTopicKey(t)+' '+tlTopicShort(t);tpSel.appendChild(o);});
  ['tl-an-bonbu','tl-an-topic','tl-an-grade'].forEach(id=>{const el=document.getElementById(id);if(el&&!el._bound){el._bound=true;el.addEventListener('change',renderTalentAnalysis);}});
  // 키워드 주제 셀렉트
  const kwSel=document.getElementById('tl-kw-topic');
  if(kwSel&&kwSel.options.length===0){Object.keys(TL_TOPIC_NAMES).forEach(tk=>{const o=document.createElement('option');o.value=tk;o.textContent=tk+' '+TL_TOPIC_NAMES[tk];kwSel.appendChild(o);});kwSel.addEventListener('change',renderTalentKwSection);}

  const P=_tlFiltered(),N=P.length||1;
  const cntS=P.filter(p=>p.grade==='S').length,cntA=P.filter(p=>p.grade==='A').length,cntE=P.filter(p=>!p.grade).length;
  const avgEl=Math.round(P.reduce((s,p)=>s+p.elearn,0)/N);
  const sub=P.filter(p=>p.submitted).length,evald=P.filter(p=>p.total!=null).length,pt=P.filter(p=>p.isPT).length;
  const avgEv=evald?Math.round(P.filter(p=>p.total!=null).reduce((s,p)=>s+p.total,0)/evald):0;

  document.getElementById('tl-an-stats').innerHTML=`
    <div class="stat-card"><div class="stat-label">교육 대상</div><div class="stat-val">${P.length}</div><div class="stat-sub">S ${cntS} · A ${cntA} · ECI ${cntE}</div></div>
    <div class="stat-card"><div class="stat-label">평균 이러닝 이수율 <span class="tl-sample">예시</span></div><div class="stat-val" style="color:var(--accent)">${avgEl}<span style="font-size:15px">%</span></div><div class="stat-sub">30시간 필수 이수</div></div>
    <div class="stat-card"><div class="stat-label">에세이 제출 <span class="tl-sample">예시</span></div><div class="stat-val" style="color:var(--success)">${sub}</div><div class="stat-sub">제출률 ${Math.round(sub/P.length*100||0)}%</div></div>
    <div class="stat-card"><div class="stat-label">평균 평가점수 <span class="tl-sample">예시</span></div><div class="stat-val" style="color:var(--primary)">${avgEv}<span style="font-size:15px">점</span></div><div class="stat-sub">평가완료 ${evald}명 · PT ${pt}명</div></div>`;

  const steps=[
    {idx:'STEP 0',name:'부서장 추천',c:P.length,of:N,sub:'전원 등록'},
    {idx:'STEP 1',name:'에세이 주제 배정',c:P.filter(p=>p.assigned).length,of:N,sub:'5개 주제 균등'},
    {idx:'STEP 2',name:'이러닝 30h 이수',c:P.filter(p=>p.elearn>=82).length,of:N,sub:'이수율 82%↑'},
    {idx:'STEP 3',name:'에세이 제출',c:sub,of:N,sub:'1,800~2,500자'},
    {idx:'STEP 4',name:'부서장 평가',c:evald,of:N,sub:'100점 만점'},
    {idx:'STEP 5',name:'PT 선정',c:pt,of:N,sub:'대표 PT·특별승진',fin:true},
  ];
  document.getElementById('tl-journey').innerHTML=steps.map(s=>`<div class="tl-step"><div class="tl-jc ${s.fin?'fin':''}"><div class="tl-idx">${s.idx}</div><div class="tl-jn">${s.name}</div><div class="tl-jcount">${s.c}<span class="of">/${s.of}</span></div><div class="tl-rail"><i style="width:${Math.round(s.c/s.of*100)}%"></i></div></div><span class="tl-arrow">▶</span></div>`).join('');

  if(window.Chart){
    const divCnt={};P.forEach(p=>{const k=p.division||'미상';divCnt[k]=(divCnt[k]||0)+1});
    const dE=Object.entries(divCnt).sort((a,b)=>b[1]-a[1]);
    if(_tlDivChart)_tlDivChart.destroy();
    _tlDivChart=new Chart(document.getElementById('tl-chart-div'),{type:'bar',data:{labels:dE.map(e=>e[0]),datasets:[{data:dE.map(e=>e[1]),backgroundColor:'#1a3a5c',borderRadius:5,barThickness:18}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{stepSize:5,font:{size:11}},grid:{color:'#eef1f5'}},y:{ticks:{font:{size:11}},grid:{display:false}}}}});
    const tCnt={};P.forEach(p=>{if(p.topic)tCnt[p.topic]=(tCnt[p.topic]||0)+1});
    const tE=Object.entries(tCnt).sort((a,b)=>tlTopicKey(a[0]).localeCompare(tlTopicKey(b[0])));
    if(_tlTopicChart)_tlTopicChart.destroy();
    _tlTopicChart=new Chart(document.getElementById('tl-chart-topic'),{type:'bar',data:{labels:tE.map(e=>tlTopicKey(e[0])),datasets:[{data:tE.map(e=>e[1]),backgroundColor:tE.map(e=>TL_TOPIC_COLORS[tlTopicKey(e[0])]||'#6b7a8d'),borderRadius:5,barThickness:30}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:(it)=>{const e=tE[it[0].dataIndex];return tlTopicKey(e[0])+' '+tlTopicShort(e[0])}}}},scales:{y:{beginAtZero:true,ticks:{stepSize:2,font:{size:11}},grid:{color:'#eef1f5'}},x:{ticks:{font:{size:11,weight:'700'}},grid:{display:false}}}}});
    if(_tlGradeChart)_tlGradeChart.destroy();
    _tlGradeChart=new Chart(document.getElementById('tl-chart-grade'),{type:'doughnut',data:{labels:['S 등급','A 등급','ECI 추천'],datasets:[{data:[cntS,cntA,cntE],backgroundColor:['#e8b84b','#2c5f8a','#6b7a8d'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'right',labels:{font:{size:12},padding:14}}}}});
    const bins={'~79':0,'80~84':0,'85~89':0,'90~94':0,'95~100':0};
    P.forEach(p=>{if(p.total==null)return;const t=p.total;if(t<80)bins['~79']++;else if(t<85)bins['80~84']++;else if(t<90)bins['85~89']++;else if(t<95)bins['90~94']++;else bins['95~100']++;});
    if(_tlScoreChart)_tlScoreChart.destroy();
    _tlScoreChart=new Chart(document.getElementById('tl-chart-score'),{type:'bar',data:{labels:Object.keys(bins),datasets:[{data:Object.values(bins),backgroundColor:'#2c5f8a',borderRadius:5,barThickness:34}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:2,font:{size:11}},grid:{color:'#eef1f5'}},x:{ticks:{font:{size:11}},grid:{display:false}}}}});
  }

  renderTalentKwSection();
  renderTalentAiSection();
}

// 에세이 키워드 섹션
function renderTalentKwSection(){
  const a=analyzeTalentEssays();
  const kwSel=document.getElementById('tl-kw-topic');
  const tk=(kwSel&&kwSel.value)||'No.1';
  const tc=TL_TOPIC_COLORS[tk]||'#6b7a8d';
  // Top 키워드: 해당 주제 풀 + 등장 빈도(샘플 essay 기준 가중)
  const counts=a.topicKw[tk]||{};
  const pool=TL_TOPIC_KW[tk].map(k=>({k,n:(counts[k]||0)+ (TL_TOPIC_KW[tk].indexOf(k)<5?2:1)}));
  pool.sort((x,y)=>y.n-x.n);
  const top=pool.slice(0,8);const max=Math.max(...top.map(t=>t.n));
  document.getElementById('tl-kw-bars').innerHTML=top.map(t=>`
    <div style="display:grid;grid-template-columns:118px 1fr 26px;align-items:center;gap:10px;margin-bottom:8px">
      <span style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.k}</span>
      <div style="height:18px;background:var(--bg);border-radius:5px;overflow:hidden"><i style="display:block;height:100%;width:${t.n/max*100}%;background:${tc};border-radius:5px"></i></div>
      <span style="font-size:12px;font-weight:700;text-align:right">${t.n}</span>
    </div>`).join('');
  document.getElementById('tl-kw-problem').textContent=TL_TOPIC_PROBLEM[tk];
  document.getElementById('tl-kw-action').textContent=TL_TOPIC_ACTION[tk];

  // 공통/고유
  const commonEl=document.getElementById('tl-kw-common');
  commonEl.innerHTML=a.common.length?a.common.slice(0,10).map(c=>`<span class="tl-kw" style="background:#eef1f5;color:#1a3a5c">${c.kw}<span class="n">${c.topics}개 주제</span></span>`).join(''):'<span style="font-size:12px;color:var(--text-muted)">2개 이상 주제에 공통 등장한 키워드가 아직 없습니다.</span>';
  const uniqEl=document.getElementById('tl-kw-unique');
  uniqEl.innerHTML=Object.keys(TL_TOPIC_NAMES).map(t=>{const c=TL_TOPIC_COLORS[t];const uniq=TL_TOPIC_KW[t].slice(0,3);return `<div style="margin-bottom:8px"><span style="font-size:11px;font-weight:700;color:${c}">${t}</span> ${uniq.map(k=>`<span class="tl-kw" style="background:${c}1a;color:${c}">${k}</span>`).join('')}</div>`;}).join('');
}

// AI 활용 섹션
function renderTalentAiSection(){
  const a=analyzeTalentEssays();
  document.getElementById('tl-ai-summary').textContent=`분석 대상 ${a.count}명 · 평균 활용 깊이 ${a.avgLevel.toFixed(1)}/5`;
  // 도구 차트
  const tE=Object.entries(a.toolCnt).sort((x,y)=>y[1]-x[1]);
  if(window.Chart){
    if(_tlAiToolChart)_tlAiToolChart.destroy();
    _tlAiToolChart=new Chart(document.getElementById('tl-chart-aitool'),{type:'bar',data:{labels:tE.map(e=>e[0]),datasets:[{data:tE.map(e=>e[1]),backgroundColor:'#2c5f8a',borderRadius:5,barThickness:16}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{stepSize:1,font:{size:11}},grid:{color:'#eef1f5'}},y:{ticks:{font:{size:11}},grid:{display:false}}}}});
  }
  // 단계 비중
  const sMax=Math.max(...Object.values(a.stageCnt),1);
  document.getElementById('tl-ai-stages').innerHTML=TL_AI_STAGES.map(s=>{const v=a.stageCnt[s]||0;return `<div class="tl-stagebar"><span class="l">${s}</span><div class="b"><i style="width:${v/sMax*100}%"></i></div><span class="v">${v}명</span></div>`;}).join('');
  // 깊이 분포
  const lMax=Math.max(...a.levelDist,1);
  document.getElementById('tl-ai-levels').innerHTML=`<div style="display:flex;gap:12px;align-items:flex-end">${a.levelDist.map((c,i)=>`
    <div style="flex:1;text-align:center">
      <div style="font-size:12px;font-weight:700;color:var(--primary);margin-bottom:4px">${c}명</div>
      <div style="height:${Math.max(8,c/lMax*90)}px;background:linear-gradient(180deg,var(--accent),var(--accent-light));border-radius:6px 6px 0 0"></div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:6px;font-weight:600">${i+1}단계</div>
    </div>`).join('')}</div>
  <div style="font-size:11px;color:var(--text-muted);margin-top:8px">1단계=문장 다듬기 수준 · 5단계=조사·분석·검증까지 능동 활용</div>`;
}
</script>
