async function edmProcess(file) {
  const y = document.getElementById('edm-year')?.value || '2026';
  const q = document.getElementById('edm-quarter')?.value || '2';
  const docKey = `eval_${y}_Q${q}`;
  const resultEl = document.getElementById('edm-result');
  if (resultEl) hrSetResult('edm-result', 'info', '⏳ 처리 중...');

  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const wb = XLSX.read(ev.target.result, {type:'binary'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      if (rows.length < 2) { hrSetResult('edm-result','warn','데이터가 없습니다.'); return; }

      // Firebase에서 기존 데이터 로드
      let existing = {};
      try {
        const doc = await db.collection('evalData').doc(docKey).get();
        existing = doc.exists ? (doc.data().data || {}) : {};
      } catch(e) {}

      let ok = 0, skip = 0;
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        if (r.every(c => c === '')) continue;
        const sabun = String(r[0]||'').trim();
        const name  = String(r[1]||'').trim();
        const g1    = String(r[2]||'').trim();
        const g2    = String(r[3]||'').trim();
        const g3    = String(r[4]||'').trim();
        const g4    = String(r[5]||'').trim();
        const g5    = String(r[6]||'').trim();
        const comment = String(r[7]||'').trim();

        const p = persons.find(x =>
          (sabun && x.sabun === sabun) ||
          (name  && (x.name||'').trim() === name)
        );
        if (!p) { skip++; continue; }

        // 항상 덮어쓰기 (빈칸도 그대로 적용)
        existing[p.no] = {
          g1, g2, g3, g4, g5, comment,
          done: !!(g1&&g2&&g3&&g4&&g5)
        };
        ok++;
      }

      await db.collection('evalData').doc(docKey).set({data: existing, updatedAt: firebase.firestore.FieldValue.serverTimestamp()});
      hrSetResult('edm-result', 'ok', `✅ ${docKey} 업로드 완료 · ${ok}명 반영 · ${skip}명 미매칭`);
      showToast(`✅ ${docKey} 업로드 완료`);
    } catch(err) {
      hrSetResult('edm-result', 'warn', '오류: ' + err.message);
    }
  };
  reader.readAsBinaryString(file);
}

async function attendBulkUpload(e) {
  const file = e.target.files[0]; if (!file) return;
  const resultEl = document.getElementById('attend-upload-result');
  if (resultEl) resultEl.textContent = '⏳ 업로드 중...';

      const wb = XLSX.read(ev.target.result, {type:'binary'});

      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      if (rows.length < 2) { showToast('데이터가 없습니다.'); return; }

      let updated = 0, skipped = 0;
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        if (r.every(c => c === '')) continue;
        const sabun  = String(r[0]||'').trim();
        const name   = String(r[1]||'').trim();
        const month  = Number(r[2])||0;
        const late   = Number(r[3])||0;
        const absent = Number(r[4])||0;
        const leave  = Number(r[5])||0;
        if (month < 1 || month > 12) continue;

        const hp = hrPersons.find(p =>
          (sabun && (p['사번']||'').trim() === sabun) ||
          (name  && (p['이름']||p['성명']||'').trim() === name)
        );
        if (!hp) { skipped++; continue; }

        const key = (hp['사번']||'').trim() || (hp['이름']||hp['성명']||'').trim();
        if (!hrExtra[key]) hrExtra[key] = {photo:'',edu:[],attend:{months:[]},history:[]};
        if (!hrExtra[key].attend) hrExtra[key].attend = {months:[]};

        let mo = hrExtra[key].attend.months.find(m => m.month === month);
        if (!mo) { mo = {month, late:0, absent:0, leave:0}; hrExtra[key].attend.months.push(mo); }
        mo.late = late; mo.absent = absent; mo.leave = leave;
        updated++;
      }

      showLoadingOverlay(true);
      await Promise.all(Object.entries(hrExtra).map(([k,v]) =>
        db.collection('hrExtra').doc(encodeURIComponent(k)).set(v)
      ));
      showLoadingOverlay(false);

      const msg = `✅ ${updated}명 근태 업로드 완료${skipped>0?` (미매핑 ${skipped}행 스킵)`:''}`;
      if (resultEl) resultEl.textContent = msg;
      showToast(msg);
    } catch(err) {
      showLoadingOverlay(false);
      showToast('오류: ' + err.message);
    }
  };
  reader.readAsBinaryString(file);
  e.target.value = '';
}

  const legend = document.getElementById(`radar-legend-${safeKey}`);

  if (year === 2024) {
    if (scorePanel) scorePanel.innerHTML = `
      <div style="padding:16px;text-align:center;background:#f8f9fc;border-radius:8px;border:1px solid var(--border)">

        <div style="font-size:12px;color:var(--text-muted)">2024년은 직무수행능력 평가가 시행되지 않았습니다.</div>
      </div>`;
    // 분기 버튼 비활성화
    ['Q1','Q2','Q3','Q4'].forEach(q => {
      const btn = document.getElementById(`radar-btn-${safeKey}-${q}`);
      if (btn) { btn.style.opacity='0.35'; btn.style.pointerEvents='none'; }
    });
    return;
  }

  // 다른 년도 분기 버튼 활성화
  ['Q1','Q2','Q3','Q4'].forEach(q => {
    const btn = document.getElementById(`radar-btn-${safeKey}-${q}`);
    if (btn) { btn.style.opacity='1'; btn.style.pointerEvents='auto'; }
  });

  if (scorePanel) scorePanel.innerHTML = `<div style="padding:12px;text-align:center;color:var(--text-muted);font-size:12px">분기를 선택하세요</div>`;
  ['Q1','Q2','Q3','Q4'].forEach(q => { delete radarDataCache[`${safeKey}_${q}`]; });
}

function getEvalItems(year, bonbu) {
  const yearData = EVAL_ITEMS[Number(year)];
  if (!yearData) return ['항목1','항목2','항목3','항목4','항목5'];
  if (!bonbu) return yearData.default || ['항목1','항목2','항목3','항목4','항목5'];
  const key = Object.keys(yearData).find(k =>
    k !== 'default' && (bonbu.includes(k) || k.includes(bonbu))
  );
  return (key ? yearData[key] : yearData.default) || ['항목1','항목2','항목3','항목4','항목5'];
}

async function selectCommentYear(safeKey, sabun, name, year) {
  commentSelectedYear[safeKey] = year;
  [2024,2025,2026].forEach(y => {
    const btn = document.getElementById(`comment-year-btn-${safeKey}-${y}`);
    if (!btn) return;
    btn.style.background = y===year ? 'var(--primary)' : 'var(--bg)';
    btn.style.color = y===year ? '#fff' : 'var(--text-muted)';
    btn.style.borderColor = y===year ? 'var(--primary)' : 'var(--border)';
  });
  const listEl = document.getElementById(`comment-list-${safeKey}`);
  if (!listEl) return;

  // 24년 미시행 처리
  if (year === 2024) {
    listEl.innerHTML = `
      <div style="padding:16px;text-align:center;background:#f8f9fc;border-radius:8px;border:1px solid var(--border)">
        <div style="font-size:13px;font-weight:700;color:var(--text-muted);margin-bottom:4px">미시행</div>
        <div style="font-size:12px;color:var(--text-muted)">2024년은 부서장 서술 평가가 시행되지 않았습니다.</div>
      </div>`;
    return;
  }

  listEl.innerHTML = '<div style="padding:12px;text-align:center;color:var(--text-muted);font-size:12px">불러오는 중...</div>';

  // 평가 기준 텍스트
  const criteria = EVAL_CRITERIA[year];
  const criteriaHtml = criteria ? `
    <div style="margin-bottom:12px;padding:10px 14px;background:#eef4fb;border-radius:8px;
      border-left:3px solid var(--primary-light)">
      <div style="font-size:10px;font-weight:700;color:var(--primary-light);margin-bottom:4px;letter-spacing:0.5px">
        📌 ${year}년 평가 기준
      </div>
      <div style="font-size:12px;color:var(--text);line-height:1.7">${criteria}</div>
    </div>` : '';

  const COLORS = ['#3266AD','#2E7D32','#E65100','#6A1B9A'];
  const person = persons.find(p => (sabun && p.sabun===sabun) || p.name===name);
  let html = criteriaHtml;

  for (let i=0; i<4; i++) {
    const q = ['Q1','Q2','Q3','Q4'][i];
    const docKey = `eval_${year}_${q}`;
    const color = COLORS[i];
    const bodyId = `cmt-body-${safeKey}-${year}-${q}`;
    const arrowId = `cmt-arrow-${safeKey}-${year}-${q}`;

    // 25년 1분기는 미시행
    if (year === 2025 && q === 'Q1') {
      html += `
      <div style="margin-bottom:8px;border-radius:8px;overflow:hidden;border:1px solid ${color}33">
        <div style="padding:10px 14px;background:#f8f9fc;display:flex;align-items:center;gap:10px">
          <span style="font-size:12px;font-weight:700;color:${color}">${i+1}분기</span>
          <span style="font-size:12px;color:var(--text-muted)">미시행 — 부서장 서술 평가가 시행되지 않았습니다.</span>
        </div>
      </div>`;
      continue;
    }

    let comment = '';
    if (person) {
      try {
        const doc = await db.collection('evalData').doc(docKey).get();
        const qData = doc.exists ? doc.data().data : {};
        const d = qData[person.no];
        comment = d ? (d.comment||'') : '';
      } catch(e) {
        const qData = JSON.parse(localStorage.getItem(docKey)||'{}');
        const d = person ? qData[person.no] : null;
        comment = d ? (d.comment||'') : '';
      }
    }

    const preview = comment ? (comment.length>50 ? comment.slice(0,50)+'...' : comment) : '서술 평가 없음';
    html += `
    <div style="margin-bottom:8px;border-radius:8px;overflow:hidden;border:1px solid ${color}33">
      <div onclick="toggleComment('${bodyId}','${arrowId}')"
        style="display:flex;align-items:center;justify-content:space-between;
        padding:10px 14px;background:${color}11;cursor:pointer">
        <span style="font-size:12px;font-weight:700;color:${color}">${i+1}분기</span>
        <div style="display:flex;align-items:center;gap:8px;flex:1;margin-left:12px;overflow:hidden">
          <span style="font-size:11px;color:var(--text-muted);flex:1;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${preview}</span>
          <span id="${arrowId}" style="font-size:12px;color:${color};transition:transform .2s;flex-shrink:0">▼</span>
        </div>
      </div>
      <div id="${bodyId}" style="display:none;padding:12px 16px;font-size:12px;
        color:var(--text);line-height:1.8;border-top:1px solid ${color}22;background:var(--surface)">
        ${comment || '<span style="color:var(--text-muted)">해당 분기 서술 평가가 없습니다.</span>'}
      </div>
    </div>`;
  }
  listEl.innerHTML = html;
}

// 2025 하드코딩 데이터를 eaAllData에 병합
function applyHardcoded2025() {
  const quarters = ['Q2']; // Q3, Q4 제거됨
  quarters.forEach(q => {
    const key = `eval_2025_${q}`;
    if (!eaAllData[key]) eaAllData[key] = {};
    Object.entries(HARDCODED_2025).forEach(([name, qdata]) => {
      const p = persons.find(x => (x.name||x['이름']||'').trim() === name);
      if (p && qdata[q]) {
        const existing = eaAllData[key][p.no];
        if (!existing || !existing.g1 || existing.g1 === '') {
          eaAllData[key][p.no] = { ...qdata[q], done: true };
        }
      }
    });
  });
}

function applyHardcoded2026() {
  const quarters = ['Q1','Q2'];
  quarters.forEach(q => {
    const key = `eval_2026_${q}`;
    if (!eaAllData[key]) eaAllData[key] = {};
    Object.entries(HARDCODED_2026).forEach(([name, qdata]) => {
      const p = persons.find(x => (x.name||x['이름']||'').trim() === name);
      if (p && qdata[q]) {
        const existing = eaAllData[key][p.no];
        // Firebase 데이터가 없거나 g1이 비어있으면 하드코딩으로 채움
        if (!existing || !existing.g1 || existing.g1 === '') {
          eaAllData[key][p.no] = { ...qdata[q], done: true };
        }
      }
    });
  });
}

function applyHardcoded2026Q2Full() {
  const key = 'eval_2026_Q2';
  if (!eaAllData[key]) eaAllData[key] = {};
  Object.entries(HARDCODED_2026_Q2_FULL).forEach(([name, d]) => {
    const p = persons.find(x => (x.name||x['이름']||'').trim() === name);
    if (p) eaAllData[key][p.no] = d;
  });
}


// ══ 평가 분석 대시보드 (실데이터) ══
const EA_COLORS = ['#1D4ED8','#059669','#D97706','#7C3AED','#DC2626','#0891B2','#9333EA','#EA580C'];
const EA_GRADE_COLORS = {S:'#1D4ED8',A:'#059669',B:'#D97706',C:'#DC2626','D/E':'#9CA3AF'};
let eaTC=null, eaDC=null, eaBC=null, eaRC=null, eaNC=null;
let eaAllData = {}; // { 'eval_2026_Q1': {...}, ... }

async function loadEvalDataForAnalysis() {
  // 2024~2026 전 분기 로드
  const keys = [];
  for (const y of [2024,2025,2026]) for (const q of [1,2,3,4]) keys.push(`eval_${y}_Q${q}`);
  await Promise.all(keys.map(async key => {
    if (eaAllData[key]) return;
    try {
      const doc = await db.collection('evalData').doc(key).get();
      eaAllData[key] = doc.exists ? (doc.data().data||{}) : {};
    } catch(e) { eaAllData[key] = JSON.parse(localStorage.getItem(key)||'{}'); }
  }));

  // 2025/2026 하드코딩 데이터 병합 (Firebase 데이터 없는 항목만)
  applyHardcoded2025();
  applyHardcoded2026();
  applyHardcoded2026Q2Full(); // Q2 서술 포함 전체 데이터 (덮어쓰기)
}

function eaCalcScore(d) {
  if (!d) return null;
  const vals = [d.g1,d.g2,d.g3,d.g4,d.g5].map(v => {
    const n = Number(v); if (!isNaN(n) && n > 0) return n;
    return {S:100,A:90,B:80,C:70,D:60,E:50}[String(v||'').toUpperCase()] || 0;
  });
  if (vals.every(v=>v>0)) return Math.round(vals.reduce((a,b)=>a+b,0)/5);
  return null;
}
function eaCalcGrade(score) {
  if (score===null) return null;
  if (score===100) return 'S'; if (score>=90) return 'A';
  if (score>=80) return 'B';  if (score>=70) return 'C'; return 'D/E';
}

async function renderEvalAnalysis() {
  await loadEvalDataForAnalysis();

  const yearSel    = document.getElementById('ea-year')?.value    || '2026';
  const quarterSel = document.getElementById('ea-quarter')?.value || 'all';
  const bonbuSel   = document.getElementById('ea-bonbu')?.value   || 'all';
  const jikchekSel = document.getElementById('ea-jikchek')?.value || 'all';

  const desc = document.getElementById('ea-filter-desc');
  if (desc) desc.textContent =
    `${yearSel==='all'?'전체 기간':yearSel+'년'} · ${quarterSel==='all'?'전체 분기':quarterSel+'분기'} · ${bonbuSel==='all'?'전체 본부':bonbuSel} · ${jikchekSel==='all'?'전체 직책':jikchekSel}`;

  // 더미배지 숨기기
  const dummyBadge = document.querySelector('.ea-dummy-badge');
  if (dummyBadge) dummyBadge.style.display = 'none';

  // 분석 대상 분기 목록
  const ALL_Q = [];
  for (const y of [2024,2025,2026]) for (const q of [1,2,3,4]) {
    ALL_Q.push({label:`${String(y).slice(2)}년 ${q}Q`, year:String(y), q:String(q), key:`eval_${y}_Q${q}`});
  }
  let qs = ALL_Q.filter(q => {
    if (yearSel!=='all' && q.year!==yearSel) return false;
    if (quarterSel!=='all' && q.q!==quarterSel) return false;
    return true;
  });
  if (!qs.length) qs = ALL_Q.filter(q=>q.year==='2026');

  // 데이터가 실제로 있는 분기만 필터 (전체 분기 선택 시)
  if (quarterSel === 'all') {
    qs = qs.filter(q => {
      const qData = eaAllData[q.key] || {};
      return Object.keys(qData).length > 0;
    });
    if (!qs.length) qs = ALL_Q.filter(q=>q.year===yearSel).slice(0,1);
  }

  // 본부 드롭다운 실데이터로 채우기 (매번 갱신)
  const bonbuSel2 = document.getElementById('ea-bonbu');
  if (bonbuSel2) {
    const prevBonbu = bonbuSel2.value;
    bonbuSel2.innerHTML = '<option value="all">전체 본부</option>';
    const bonbuSet = new Set(persons.filter(p=>p.active!==false).map(p=>(p.bonbu||'').trim()).filter(Boolean));
    [...bonbuSet].sort().forEach(b => {
      const opt = document.createElement('option');
      opt.value = b; opt.textContent = b;
      if (b === prevBonbu) opt.selected = true;
      bonbuSel2.appendChild(opt);
    });
  }

  const bonbuList = [...new Set(persons.filter(p=>p.active!==false).map(p=>(p.bonbu||'').trim()).filter(Boolean))].sort();

  // 필터 적용된 직책자 목록
  function filterPersons(ps) {
    return ps.filter(p => {
      if (p.active===false) return false;
      if (bonbuSel!=='all' && (p.bonbu||'')!==bonbuSel) return false;
      if (jikchekSel!=='all' && (p.jikchek||'')!==jikchekSel) return false;
      return true;
    });
  }

  // 분기별 평균 계산
  function getQAvg(qKey, pList) {
    const qData = eaAllData[qKey]||{};
    const scores = pList.map(p=>eaCalcScore(qData[p.no])).filter(s=>s!==null);
    return scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
  }

  const filteredPersons = filterPersons(persons);
  const lastQ  = qs[qs.length-1];
  const prevQ  = qs.length>1 ? qs[qs.length-2] : null;
  const avgNow  = getQAvg(lastQ.key, filteredPersons);
  const avgPrev = prevQ ? getQAvg(prevQ.key, filteredPersons) : null;
  const diff = (avgNow!==null && avgPrev!==null) ? avgNow-avgPrev : null;

  // 인센티브 집계
  const lastQData = eaAllData[lastQ.key]||{};
  let incCnt=0, doneCnt=0;
  filteredPersons.forEach(p => {
    const d=lastQData[p.no]; if(!d) return;
    const score=eaCalcScore(d); if(score===null) return;
    doneCnt++;
    if (isIncentive(eaCalcGrade(score), p.nyeoncha)) incCnt++;
  });

  // 최고 본부
  let bestB='', bestScore=0;
  bonbuList.forEach(b => {
    const ps=filterPersons(persons.filter(p=>p.bonbu===b));
    const avg=getQAvg(lastQ.key,ps);
    if (avg!==null && avg>bestScore) { bestScore=avg; bestB=b; }
  });

  // 실제 평가 데이터 있는 인원 수
  const evaluatedCnt = filteredPersons.filter(p => {
    const d = lastQData[p.no];
    return d && eaCalcScore(d) !== null;
  }).length;
  const totalCnt = evaluatedCnt > 0 ? evaluatedCnt : filteredPersons.length;

  const setEl=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  setEl('ea-s-total', totalCnt+'명');
  setEl('ea-s-avg',      avgNow!==null ? avgNow+'점' : '-');
  setEl('ea-s-diff',     diff!==null ? `전분기 대비 ${diff>=0?'+':''}${diff}점` : '-');
  setEl('ea-s-incentive',incCnt+'명');
  setEl('ea-s-inc-pct',  doneCnt>0?`전체의 ${Math.round(incCnt/doneCnt*100)}%`:'-');
  setEl('ea-s-best',     bestB||'-');
  setEl('ea-s-best-score', bestScore>0?'평균 '+bestScore+'점':'-');

  const chartDefaults = { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}} };
  const gridStyle = {color:'#F0F2F5',drawBorder:false};
  const tickStyle = {font:{size:11,family:"'Malgun Gothic',sans-serif"},color:'#8A94A6'};

  // 추이 차트
  const tLabels = qs.map(q=>q.label);
  let tDatasets = [];
  if (bonbuSel==='all') {
    tDatasets = bonbuList.map((b,i)=>({
      label:b,
      data:qs.map(q=>getQAvg(q.key,filterPersons(persons.filter(p=>p.bonbu===b)))),
      borderColor:EA_COLORS[i%EA_COLORS.length],
      backgroundColor:EA_COLORS[i%EA_COLORS.length]+'18',
      borderWidth:2, pointRadius:3.5, fill:false, tension:0.4
    }));
    setEl('ea-trend-title','분기별 평균 점수 추이 — 전체 본부');
  } else {
    const overall = qs.map(q=>getQAvg(q.key,filterPersons(persons)));
    const bonbuAvg = qs.map(q=>getQAvg(q.key,filterPersons(persons.filter(p=>p.bonbu===bonbuSel))));
    tDatasets = [
      {label:'전체 평균', data:overall, borderColor:'#9E9E9E', borderDash:[5,4], borderWidth:1.5, pointRadius:2.5, fill:false, tension:0.4},
      {label:bonbuSel, data:bonbuAvg, borderColor:'#1D4ED8', backgroundColor:'#1D4ED822', borderWidth:2.5, pointRadius:5, fill:true, tension:0.4},
    ];
    setEl('ea-trend-title','분기별 평균 점수 추이 — '+bonbuSel);
  }
  const legEl = document.getElementById('ea-trend-legend');
  if (legEl) legEl.innerHTML = tDatasets.map(d=>
    `<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted)">
      <span style="width:10px;height:10px;border-radius:2px;background:${d.borderColor};display:inline-block"></span>${d.label}</span>`).join('');

  const allVals = tDatasets.flatMap(d=>d.data).filter(v=>v!==null&&v!==undefined);
  const dataMin = allVals.length ? Math.min(...allVals) : 50;
  const yMin = Math.max(0, Math.floor((dataMin - 10) / 5) * 5);

  if(eaTC) eaTC.destroy();
  eaTC = new Chart(document.getElementById('ea-trendChart'),{
    type:'line', data:{labels:tLabels,datasets:tDatasets},
    options:{...chartDefaults,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{backgroundColor:'#111827',titleColor:'#fff',bodyColor:'#D1D5DB',padding:10,cornerRadius:8,
        callbacks:{label:c=>c.raw!==null?`  ${c.dataset.label}: ${c.raw}점`:'  데이터 없음'}}},
      scales:{y:{min:yMin,max:100,grid:gridStyle,ticks:{...tickStyle,callback:v=>v+'점'},border:{display:false}},
              x:{grid:{display:false},ticks:tickStyle,border:{display:false}}}}
  });

  // 등급 분포 도넛
  const gradeDist = {S:0,A:0,B:0,C:0,'D/E':0};
  filteredPersons.forEach(p=>{
    const d=lastQData[p.no]; if(!d) return;
    const score=eaCalcScore(d); if(score===null) return;
    const g=eaCalcGrade(score); if(g) gradeDist[g]=(gradeDist[g]||0)+1;
  });
  const gKeys=Object.keys(gradeDist), gVals=Object.values(gradeDist);
  const EA_GRADE_COLORS2={S:'#1D4ED8',A:'#059669',B:'#D97706',C:'#DC2626','D/E':'#9CA3AF'};
  const badgesEl=document.getElementById('ea-grade-badges');
  if(badgesEl) badgesEl.innerHTML=gKeys.map(k=>
    `<span style="font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700;background:${EA_GRADE_COLORS2[k]}18;color:${EA_GRADE_COLORS2[k]};border:1px solid ${EA_GRADE_COLORS2[k]}33">${k} · ${gradeDist[k]}명</span>`
  ).join('');
  if(eaDC) eaDC.destroy();
  eaDC = new Chart(document.getElementById('ea-donutChart'),{
    type:'doughnut',
    data:{labels:gKeys, datasets:[{data:gVals, backgroundColor:gKeys.map(k=>EA_GRADE_COLORS2[k]), borderWidth:3, borderColor:'#fff'}]},
    options:{
      responsive:true, maintainAspectRatio:false,
      cutout:'62%',
      layout:{padding:{top:4,bottom:4}},
      plugins:{
        legend:{
          display:true, position:'right',
          labels:{font:{size:12},color:'#374151',padding:14,usePointStyle:true,pointStyleWidth:10,
            generateLabels: chart => {
              const total = chart.data.datasets[0].data.reduce((a,b)=>a+b,0);
              return chart.data.labels.map((label,i) => ({
                text: `${label}  ${chart.data.datasets[0].data[i]}명 (${total>0?Math.round(chart.data.datasets[0].data[i]/total*100):0}%)`,
                fillStyle: chart.data.datasets[0].backgroundColor[i],
                strokeStyle: '#fff',
                pointStyle: 'circle',
                hidden: false,
                index: i
              }));
            }
          }
        },
        tooltip:{
          backgroundColor:'#111827',titleColor:'#fff',bodyColor:'#D1D5DB',padding:10,cornerRadius:8,
          callbacks:{
            label: ctx => {
              const total = ctx.dataset.data.reduce((a,b)=>a+b,0);
              const pct = total>0 ? Math.round(ctx.parsed/total*100) : 0;
              return ` ${ctx.label}: ${ctx.parsed}명 (${pct}%)`;
            }
          }
        }
      }
    }
  });

  // 본부별 평균 막대
  const bLabels=bonbuList.map(b=>b.length>5?b.slice(0,5)+'…':b);
  const bVals=bonbuList.map(b=>getQAvg(lastQ.key,filterPersons(persons.filter(p=>p.bonbu===b)))||0);
  const bColors=bonbuList.map((b,i)=>bonbuSel==='all'||bonbuSel===b?EA_COLORS[i%EA_COLORS.length]:'#E5E7EB');
  const barMin = bVals.filter(v=>v>0).length ? Math.max(0, Math.floor((Math.min(...bVals.filter(v=>v>0)) - 10) / 5) * 5) : 0;
  // 전체 인원 평균선 (현재 분기, 필터 반영)
  const eaOverallAvg = getQAvg(lastQ.key, filterPersons(persons));
  const eaAvgLinePlugin = {
    id:'eaAvgLine',
    afterDatasetsDraw(chart){
      if (eaOverallAvg == null) return;
      const {ctx, chartArea:{left,right,top}, scales:{y}} = chart;
      const yPos = y.getPixelForValue(eaOverallAvg);
      if (!isFinite(yPos)) return;
      ctx.save();
      ctx.beginPath();
      ctx.setLineDash([6,4]); ctx.lineWidth=2; ctx.strokeStyle='#EF4444';
      ctx.moveTo(left,yPos); ctx.lineTo(right,yPos); ctx.stroke();
      ctx.setLineDash([]);
      const txt = `전체 평균 ${eaOverallAvg}점`;
      ctx.font='700 11px "Malgun Gothic", sans-serif';
      const w = ctx.measureText(txt).width + 18, h = 19, x = right - w;
      let ly = yPos - h - 3; if (ly < top) ly = yPos + 3;
      const r = h/2;
      ctx.fillStyle='#EF4444';
      ctx.beginPath();
      ctx.moveTo(x+r,ly);
      ctx.arcTo(x+w,ly,x+w,ly+h,r); ctx.arcTo(x+w,ly+h,x,ly+h,r);
      ctx.arcTo(x,ly+h,x,ly,r); ctx.arcTo(x,ly,x+w,ly,r);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='#fff'; ctx.textBaseline='middle'; ctx.textAlign='left';
      ctx.fillText(txt, x+9, ly+h/2+0.5);
      ctx.restore();
    }
  };
  if(eaBC) eaBC.destroy();
  eaBC = new Chart(document.getElementById('ea-barChart'),{
    type:'bar', data:{labels:bLabels,datasets:[{data:bVals,backgroundColor:bColors,borderRadius:6,borderWidth:0}]},
    plugins:[eaAvgLinePlugin],
    options:{...chartDefaults,plugins:{legend:{display:false},
      tooltip:{backgroundColor:'#111827',titleColor:'#fff',bodyColor:'#D1D5DB',padding:10,cornerRadius:8,callbacks:{label:c=>`평균 ${c.raw}점`}}},
      scales:{y:{min:barMin,max:100,grid:gridStyle,ticks:{...tickStyle,callback:v=>v+'점'},border:{display:false}},
              x:{grid:{display:false},ticks:tickStyle,border:{display:false}}}}
  });

  // 레이더 (5개 항목 평균)

    : ['방향제시·동기부여','감정이해·피드백','해결책 도출','직무전문성','조직관리능력'];

    return scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;
  });
  setEl('ea-radar-title',`역량 항목별 평균 (${yearSel==='all'?'전체':yearSel+'년'} ${quarterSel==='all'?'전체':quarterSel+'분기'})`);

  eaRC = new Chart(document.getElementById('ea-radarChart'),{
    type:'radar', data:{labels:rLabels,datasets:[{label:'평균',data:rVals,backgroundColor:'#1D4ED808',borderColor:'#1D4ED8',borderWidth:2,pointBackgroundColor:'#1D4ED8',pointRadius:4,pointHoverRadius:6}]},
    options:{...chartDefaults,scales:{r:{min:0,max:100,grid:{color:'#E5E7EB'},angleLines:{color:'#E5E7EB'},ticks:{font:{size:10},color:'#9CA3AF',stepSize:20,backdropColor:'transparent'},pointLabels:{font:{size:10},color:'#374151'}}}}
  });

  // 레이더 점수 목록
  const radarScoresEl = document.getElementById('ea-radar-scores');
  if (radarScoresEl) {
    const maxRVal = Math.max(...rVals.filter(v=>v>0)) || 100;
    // 점수 높은 순 정렬
    const sorted = rLabels.map((label, i) => ({label, val: rVals[i]||0}))
      .sort((a,b) => b.val - a.val);
    radarScoresEl.innerHTML = sorted.map(({label, val}, idx) => {
      const barW = val > 0 ? Math.round(val / maxRVal * 100) : 0;
      const isTop = idx === 0;
      const isBot = idx === sorted.length - 1;
      const valColor = isTop ? '#0F6E56' : isBot ? '#8A94A6' : '#374151';
      const barColor = isTop ? '#0F6E56' : isBot ? '#D1D5DB' : '#93C5FD';
      return `
        <div>
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px">
            <span style="font-size:10px;color:var(--text-muted)">${label}</span>

  renderCommentCharts();

  const adminOnly = document.getElementById('ea-admin-only-section');

  // Firebase에 저장된 AI 분석 결과 로드
  try {

  // 연초 방향이 입력된 평가자 중 아직 분석 안 된 것 자동 분석
  await autoAnalyzeAll();
}

async function saveEvalDirection(evalId, year) {
  const textarea = document.getElementById(`ed-text-${evalId}`);
  if (!textarea) return;
  const text = textarea.value.trim();
  if (!evalDirections[evalId]) evalDirections[evalId] = {};
  evalDirections[evalId][year] = text;
  try {
    await db.collection('evalDirections').doc(evalId).set(evalDirections[evalId]);
    textarea.style.borderColor = 'var(--success)';
    showToast('✅ 저장 완료');
    // AI 분석 캐시 무효화
    delete aiAnalysisCache[`${evalId}_${year}`];
  } catch(e) { showToast('저장 실패: '+e.message); }
}

// ── 전체 평가자 자동 분석 ──
async function autoAnalyzeAll() {
  const yearSel = document.getElementById('ea-year')?.value || '2026';
  const evalAccs = accounts.filter(a => a.role === 'eval');
  const toAnalyze = evalAccs.filter(a => {
    const direction = evalDirections[a.id]?.[yearSel] || '';
    const cacheKey = `${a.id}_${yearSel}`;
    return direction && !aiAnalysisCache[cacheKey];
  });

  if (!toAnalyze.length) return;

  // 상태 표시
  const statusEl = document.getElementById('ea-ai-status');
  if (statusEl) statusEl.textContent = `⏳ ${toAnalyze.length}명 AI 분석 중...`;

  for (const a of toAnalyze) {
    const direction = evalDirections[a.id]?.[yearSel] || '';
    await runAiAnalysis(a.id, yearSel, direction, true);
  }

  if (statusEl) statusEl.textContent = '';
  updateConsistencyList();
  updateBonbuTags();
  renderCommentCharts();
}

    if (badge) { badge.style.display='none'; badge.textContent=''; }
    if (statusEl) statusEl.textContent = '';
    if (subEl) subEl.textContent = '평가자를 선택하면 자동으로 AI 분석이 실행됩니다';
    const grid = document.getElementById('ea-quarter-grid');
    if (grid) grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:24px;color:var(--text-muted);font-size:13px">위 배너에서 평가자를 선택하세요</div>';
    const dirBox = document.getElementById('ea-dir-box');
    if (dirBox) dirBox.style.display = 'none';
    return;
  }

  // 서술 먼저 표시
  await renderCommentDetail();

  // 캐시 있으면 바로 끝
  const yearSel = document.getElementById('ea-year')?.value || '2026';
  const cacheKey = `${evalId}_${yearSel}`;
  if (aiAnalysisCache[cacheKey]) {
    renderCommentCharts();
    return;
  }

  // 연초 방향 없으면 AI 분석 스킵
  const direction = evalDirections[evalId]?.[yearSel] || '';
  if (!direction) {
    if (statusEl) statusEl.textContent = '⚠️ 연초 방향 미입력 — AI 분석 불가';
    return;
  }

  // 자동 AI 분석 실행
  if (statusEl) statusEl.textContent = '⏳ 분석 중...';
  if (subEl) subEl.textContent = 'AI 분석 실행 중...';
  await runAiAnalysis(evalId, yearSel, direction);
  if (statusEl) statusEl.textContent = '';
  if (subEl) subEl.textContent = '분기별 서술 내용 및 AI 일치도 분석 결과';
  renderCommentCharts();
}

async function runAiAnalysis(evalId, yearSel, direction, silent=false) {
  const cacheKey = `${evalId}_${yearSel}`;

  // 분기별 서술 수집
  const myPersons = persons.filter(p => p.evaluatorId === evalId && p.active !== false);
  const quarters = [];
  for (let i = 0; i < 4; i++) {
    const q = ['Q1','Q2','Q3','Q4'][i];
    const qData = eaAllData[`eval_${yearSel}_${q}`] || {};
    const comments = myPersons
      .map(p => ({ name: p.name, text: qData[p.no]?.comment || '' }))
      .filter(c => c.text);
    quarters.push({ q: `${i+1}분기`, comments });
  }

  const promptText = `당신은 인사평가 분석 전문가입니다.

[연초 평가 방향]
"${direction}"

[분기별 실제 서술 내용]
${quarters.map(q => `${q.q}: ${q.comments.length ? q.comments.map(c=>`${c.name}: "${c.text}"`).join(' / ') : '서술 없음'}`).join('\n')}

[일치도 산정 기준 — 매우 중요]
- "일치도"는 서술 내용이 위 [연초 평가 방향]의 주제·의도를 다루고 있는 정도만을 의미합니다.
- 평가 내용이 긍정이든 부정이든(예: "조직 관리 미흡", "소통 부재" 같은 지적) 상관없이, 그 방향의 주제를 다루고 있으면 일치도를 높게 매기세요.
- "잘했다/못했다"는 일치도에 절대 반영하지 말고, 오직 tone(긍정/중립/부정)으로만 구분하세요.
- 일치도를 낮게 매기는 경우는, 서술이 연초 방향과 무관한 다른 주제를 다루거나 방향에서 벗어났을 때뿐입니다.
- alert(방향 이탈)도 '부정적 평가'가 아니라 '서술이 연초 방향의 주제에서 크게 벗어났을 때'만 true로 하세요.

위 기준에 따라 다음 JSON 형식으로만 응답하세요. 다른 텍스트 없이 JSON만 출력하세요:
{
  "avgMatch": 전체 평균 일치도(주제 반영 정도, 긍·부정 무관) 0-100 숫자,
  "quarters": [
    {
      "q": "1분기",
      "match": 일치도(주제 반영 정도, 긍·부정 무관) 0-100 숫자,
      "tone": "긍정" 또는 "중립" 또는 "부정",
      "keywords": ["키워드1", "키워드2"],
      "summary": "한 문장 요약",
      "alert": true 또는 false
    }
  ],
  "topKeywords": [
    {"word": "실제 서술에서 자주 등장한 핵심 단어", "count": 언급 횟수 숫자}
  ],
  "strengths": ["강점 키워드1", "강점 키워드2"],
  "weaknesses": ["보완 키워드1"]
}
topKeywords는 서술 전체에서 의미있게 자주 등장한 핵심 단어 상위 10개를 추출하세요. 조사·접속사·대명사는 제외하고 명사·동사 위주로 추출하세요.`;

  try {
    const res = await fetch('https://hrreader.jjunny88.workers.dev/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: promptText }]
      })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text || '';
    const clean = text.replace(/```json|```/g, '').trim();
    const result = JSON.parse(clean);
    aiAnalysisCache[cacheKey] = { ...result, evalId, year: yearSel, direction };
    renderAiResults(aiAnalysisCache[cacheKey], evalId, yearSel);
    renderCommentCharts(); // 키워드 차트도 갱신
    // 배지 표시
    const badge = document.getElementById('ea-avg-match-badge');
    if (badge && result.avgMatch !== undefined) {
      badge.textContent = '평균 일치도 ' + result.avgMatch + '%';
      badge.style.color = eaMatchColor(result.avgMatch);
      badge.style.background = eaMatchColor(result.avgMatch) + '22';
      badge.style.display = 'inline-block';
    }
    await db.collection('aiAnalysis').doc(cacheKey).set({ ...result, evalId, year: yearSel, updatedAt: new Date().toISOString() });
    if (!silent) showToast('✅ AI 분석 완료');
  } catch(e) {
    showToast('AI 분석 실패: ' + e.message);
  }
}

// ── 일치도 + 성실도 + 키워드 차트 (실데이터) ──
function renderCommentCharts() {
  const yearSel   = document.getElementById('ea-year')?.value || '2026';
  const evalAccs  = accounts.filter(a=>a.role==='eval');
  const selEvalId = document.getElementById('ea-person-sel')?.value || '';

  // 성실도: 항상 평가자별 평균 글자수 (선택 여부 무관)
  const lenData = evalAccs.map(a => {
    const myPs = persons.filter(p=>p.evaluatorId===a.id && p.active!==false);
    let total=0, cnt=0;
    ['Q1','Q2','Q3','Q4'].forEach(q => {
      const qData = eaAllData[`eval_${yearSel}_${q}`]||{};
      myPs.forEach(p => { const c=qData[p.no]?.comment||''; if(c){total+=c.length;cnt++;} });
    });
    return { name: a.name, avg: cnt>0?Math.round(total/cnt):0 };
  });

  if (eaLenC) eaLenC.destroy();
  const lenEl = document.getElementById('ea-lenChart');
  if (lenEl && lenData.length) {
    eaLenC = new Chart(lenEl, {
      type:'bar',
      data:{labels:lenData.map(d=>d.name), datasets:[{
        data:lenData.map(d=>d.avg),
        backgroundColor:lenData.map(d=> {
          if (selEvalId) {
            const a = evalAccs.find(a=>a.name===d.name);
            return a?.id === selEvalId ? '#1D4ED8' : (d.avg>=100?'#93C5FD':'#FCA5A5');
          }
          return d.avg>=100?'#1D4ED8':'#FCA5A5';
        }),
        borderRadius:6, borderWidth:0
      }]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{backgroundColor:'#111827',titleColor:'#fff',bodyColor:'#D1D5DB',padding:10,cornerRadius:8,callbacks:{label:c=>c.raw+'자'}}},
        scales:{y:{min:0,grid:{color:'#F0F2F5'},ticks:{font:{size:10},color:'#8A94A6',callback:v=>v+'자'},border:{display:false}},
                x:{grid:{display:false},ticks:{font:{size:10},color:'#8A94A6'},border:{display:false}}}}
    });
  }

  // 키워드 빈도: AI 분석 결과 우선, 없으면 단순 카운트
  const yearSel2 = yearSel; // 클로저용
  let kwPairs = [];

  if (selEvalId) {
    const cached = aiAnalysisCache[`${selEvalId}_${yearSel2}`];
    if (cached?.topKeywords?.length) {
      // AI가 추출한 실제 키워드
      kwPairs = cached.topKeywords.map(k => ({k: k.word, v: k.count})).sort((a,b)=>b.v-a.v);
    }
  }

  // AI 결과 없으면 전체 단순 카운트 (기존 방식)
  if (!kwPairs.length) {
    const KEYWORD_LIST = ['성과','소통','동기부여','코칭','리더십','협업','목표','역량','문제해결','책임'];
    const targetPersons2 = selEvalId
      ? persons.filter(p=>p.evaluatorId===selEvalId && p.active!==false)
      : persons.filter(p=>p.active!==false);
    const kwCnt2 = KEYWORD_LIST.map(kw => {
      let cnt=0;
      ['Q1','Q2','Q3','Q4'].forEach(q => {
        const qData = eaAllData[`eval_${yearSel2}_${q}`]||{};
        targetPersons2.forEach(p => {
          const c = qData[p.no]?.comment||'';
          const matches = c.match(new RegExp(kw,'g'));
          if (matches) cnt += matches.length;
        });
      });
      return cnt;
    });
    kwPairs = KEYWORD_LIST.map((k,i)=>({k,v:kwCnt2[i]})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  }

  // 키워드 워드클라우드 태그
  const kwTagEl = document.getElementById('ea-keyword-tags');
  if (kwTagEl && kwPairs.length) {
    const maxV = kwPairs[0].v || 1;
    kwTagEl.innerHTML = kwPairs.map(p => {
      const ratio = p.v / maxV;
      const size = Math.round(11 + ratio * 10);
      const opacity = 0.4 + ratio * 0.6;
      return `<span style="font-size:${size}px;font-weight:${ratio>0.6?700:500};
        color:#1D4ED8;opacity:${opacity.toFixed(2)};padding:3px 8px;
        background:#EFF6FF;border-radius:20px;border:1px solid #BFDBFE;cursor:default"
        title="${p.v}회">${p.k}</span>`;
    }).join('');
  }
  const kwEl = document.getElementById('ea-keywordChart');
  if (eaKwC) { eaKwC.destroy(); eaKwC = null; }
  // 혹시 남은 Chart 인스턴스 강제 제거
  if (kwEl && Chart.getChart(kwEl)) Chart.getChart(kwEl).destroy();
  if (kwEl) {
    eaKwC = new Chart(kwEl, {
      type:'bar',
      data:{labels:kwPairs.map(p=>p.k), datasets:[{data:kwPairs.map(p=>p.v),backgroundColor:'#1D4ED818',borderColor:'#1D4ED8',borderWidth:1.5,borderRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',
        plugins:{legend:{display:false},tooltip:{backgroundColor:'#111827',titleColor:'#fff',bodyColor:'#D1D5DB',padding:10,cornerRadius:8,callbacks:{label:c=>c.raw+'회'}}},
        scales:{x:{grid:{color:'#F0F2F5'},ticks:{font:{size:10},color:'#8A94A6',callback:v=>v+'회'},border:{display:false}},
                y:{grid:{display:false},ticks:{font:{size:10},color:'#374151'},border:{display:false}}}}
    });
  }

  // 강점/보완 태그 (AI 분석 결과 기반)
  updateBonbuTags();
  // 일치도 목록
  updateConsistencyList();
  // 드롭다운 채우기
  initCommentSection();
}

function updateConsistencyList() {
  const yearSel = document.getElementById('ea-year')?.value || '2026';
  const listEl = document.getElementById('ea-consistency-list');
  if (!listEl) return;
  const evalAccs = accounts.filter(a=>a.role==='eval');
  const items = evalAccs.map(a => {
    const cached = aiAnalysisCache[`${a.id}_${yearSel}`];
    return { id: a.id, name: a.name, bonbu: a.jijum||a.bonbu||'', match: cached?.avgMatch ?? null };
  }).filter(x=>x.match!==null).sort((a,b)=>b.match-a.match);

  if (!items.length) {
    listEl.innerHTML = '<div style="padding:12px;font-size:12px;color:var(--text-muted);text-align:center">AI 분석 후 표시됩니다</div>';

  // 카드형 그리드 - 컴팩트 비즈니스 스타일
  listEl.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;padding-top:4px">
    ${items.map(item => {
      const color = eaMatchColor(item.match);

      <div onclick="document.getElementById('ea-person-sel').value='${item.id}';onEvalSelChange()"

        <div style="font-size:10px;color:var(--text-muted);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${item.bonbu}</div>
        <div style="font-size:20px;font-weight:800;color:${color};line-height:1">${item.match}<span style="font-size:11px;font-weight:500">%</span></div>
        <div style="margin-top:6px;height:3px;border-radius:2px;background:#F0F2F5;overflow:hidden">
          <div style="height:100%;border-radius:2px;width:${item.match}%;background:${color}"></div>
        </div>
      </div>`;
    }).join('')}
  </div>`;

function updateBonbuTags() {

let dashChart = null;
let dashLogsCache = null; // Firebase 로그 캐시

async function initDashboard() {
  // 초기화 버튼 권한 제어
  const clearWrap = document.getElementById('dash-clear-btn-wrap');
  if (clearWrap) clearWrap.style.display = currentUser.role === 'admin' ? 'flex' : 'none';

  dashLogsCache = null;
  await loadDashLogs();
  switchDashPeriod(7);
}

async function clearAccessLogs() {
  if (!confirm('접속 기록을 전체 초기화할까요?\n\n이 작업은 되돌릴 수 없습니다.')) return;
  try {
    showToast('⏳ 초기화 중...');
    const snap = await db.collection('accessLogs').get();
    const batch = db.batch();
    snap.forEach(doc => batch.delete(doc.ref));
    await batch.commit();
    dashLogsCache = [];
    await switchDashPeriod(7);
    showToast('✅ 접속 기록이 초기화되었습니다.');
  } catch(e) {
    showToast('초기화 실패: ' + e.message);
  }
}


async function loadDashLogs() {
  if (dashLogsCache) return dashLogsCache;
  try {
    // 최근 30일 로그 가져오기
    const since = new Date();
    since.setDate(since.getDate() - 30);
    const sinceStr = since.toISOString().slice(0,10);
    const snap = await db.collection('accessLogs').get();
    dashLogsCache = [];
    snap.forEach(doc => {
      const d = doc.data();
      if (d.date >= sinceStr) dashLogsCache.push(d);
    });
  } catch(e) { dashLogsCache = []; }
  return dashLogsCache;
}

function switchDashPeriod(days) {
  [7,14,30].forEach(d => {
    const btn = document.getElementById('dash-btn-'+d);
    if (btn) btn.className = d===days ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
  });

  const logs = dashLogsCache || [];
  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);

  // 날짜 레이블 생성 (서비스 시작일 이전 날짜는 그래프에서 제외)
  const SERVICE_START = '2026-06-05'; // 이 날짜 이전은 표시하지 않음
  const labels = [];
  const dateKeys = [];
  for (let i = days-1; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    if (key < SERVICE_START) continue;
    labels.push((d.getMonth()+1)+'/'+(d.getDate()));
    dateKeys.push(key);
  }

  // 일별 유니크 접속자 수
  const dailyCounts = dateKeys.map(dk => {
    const users = new Set(logs.filter(l=>l.date===dk && l.loginCount>0).map(l=>l.userId));
    return users.size;
  });

  // 오늘/이번주 집계
  const todayLogs = logs.filter(l=>l.date===todayStr);
  const todayUsers = new Set(todayLogs.map(l=>l.userId));
  document.getElementById('dash-today-cnt').textContent = todayUsers.size+'명';

  const weekStart = new Date(); weekStart.setDate(weekStart.getDate()-6);
  const weekStartStr = weekStart.toISOString().slice(0,10);
  const weekUsers = new Set(logs.filter(l=>l.date>=weekStartStr).map(l=>l.userId));
  document.getElementById('dash-week-cnt').textContent = weekUsers.size+'명';
  document.getElementById('dash-week-sub').textContent = '최근 7일 기준';

  const totalLogins = logs.reduce((s,l)=>s+(l.loginCount||0),0);
  document.getElementById('dash-total-cnt').textContent = totalLogins+'회';

  // 그래프
  const canvas = document.getElementById('dash-line-chart');
  if (!canvas) return;
  if (dashChart) { dashChart.destroy(); dashChart = null; }
  dashChart = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets: [{
      label:'접속자', data:dailyCounts,
      borderColor:'#3266AD', backgroundColor:'#3266AD18', tension:0.3, pointRadius:3, fill:true
    }]},
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false},
        tooltip:{callbacks:{label:c=>`${c.raw}명`}} },
      scales:{
        x:{grid:{color:'#88878018'},ticks:{font:{size:10},color:'#888780'}},
        y:{grid:{color:'#88878018'},ticks:{font:{size:10},color:'#888780'},beginAtZero:true,
           ticks:{stepSize:1,callback:v=>Number.isInteger(v)?v+'명':''}}
      }
    }
  });

  // 사용자별 최근 접속 목록
  const userMap = {};
  logs.forEach(l => {
    if (!userMap[l.userId]) userMap[l.userId] = {name:l.userName,role:l.role,loginCount:0,lastLogin:null};
    userMap[l.userId].loginCount += (l.loginCount||0);
    if (!userMap[l.userId].lastLogin || l.date > userMap[l.userId].lastLogin) {
      userMap[l.userId].lastLogin = l.date;
    }
  });
  const userList = Object.values(userMap)
    .filter(u => u.role !== 'admin' && u.role !== 'ceo')
    .sort((a,b)=>(b.lastLogin||'').localeCompare(a.lastLogin||''));

  function relativeDate(dateStr) {
    if (!dateStr) return '접속 없음';
    const diff = Math.floor((new Date() - new Date(dateStr)) / 86400000);
    if (diff === 0) return '오늘';
    if (diff === 1) return '어제';
    return diff+'일 전';
  }

  const userListEl = document.getElementById('dash-user-list');
  if (userListEl) {
    if (!userList.length) {
      userListEl.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:12px">접속 기록이 없습니다.</div>';
    } else {
      userListEl.innerHTML = userList.map(u => `
        <div style="display:flex;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px">
          <span style="flex:1;font-weight:600;color:var(--text)">${u.name}</span>
          <span style="font-size:11px;color:var(--text-muted);margin-right:12px">${relativeDate(u.lastLogin)}</span>
          <span style="font-weight:700;color:var(--primary)">${u.loginCount}회</span>
        </div>`).join('');
    }
  }

  // 페이지 방문 필터 드롭다운 채우기
  const pfSel = document.getElementById('dash-page-user-filter');
  if (pfSel) {
    const prevVal = pfSel.value;
    pfSel.innerHTML = '<option value="">전체</option>';
    const fixedEvals = ['김시황','노재규','남형주','김병진','문정석','이문성','김근욱'];
    accounts.filter(a => fixedEvals.includes(a.name)).forEach(a => {
      const opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = a.name;
      if (a.id === prevVal) opt.selected = true;
      pfSel.appendChild(opt);
    });
  }

  renderPageVisitList();
}

function renderPageVisitList() {
  const logs = dashLogsCache || [];
  const filterUid = document.getElementById('dash-page-user-filter')?.value || '';
  const PAGE_LABELS = {
    'overview':'직책자 현황','result':'전체 평가 결과','dashboard':'접속 현황',
    'eval-analysis':'평가 분석','hr-list':'직책자 인적사항','hr-detail':'개인 상세 카드','members':'인원 통합 관리',
    'pdf-manage':'PDF 관리','criteria':'평가 및 인센티브 기준','my-overview':'본부 직책자 현황',
    'eval':'평가 입력','my-dashboard':'내 평가 결과',
    'eval-direction':'연초 방향 설정','eval-system':'직책자 평가제도',
  };
  function getPageLabel(page) {
    if (page.startsWith('hr-detail:')) return `개인 상세 카드 (${page.split(':')[1]})`;
    return PAGE_LABELS[page] || page;
  }

  const filteredLogs = filterUid
    ? logs.filter(l=>l.userId===filterUid)
    : logs.filter(l=>l.role!=='admin' && l.role!=='ceo');
  const pageMap = {};
  filteredLogs.forEach(l => {
    if (l.pages) Object.entries(l.pages).forEach(([page,cnt]) => {
      pageMap[page] = (pageMap[page]||0) + cnt;
    });
  });
  const pageList = Object.entries(pageMap).sort((a,b)=>b[1]-a[1]);
  const maxPageCnt = pageList[0]?.[1] || 1;

  const pageListEl = document.getElementById('dash-page-list');
  if (!pageListEl) return;
  if (!pageList.length) {
    pageListEl.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:12px">방문 기록이 없습니다.</div>';
    return;
  }
  pageListEl.innerHTML = pageList.map(([page,cnt]) => `
    <div style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px">
        <span style="color:var(--text)">${getPageLabel(page)}</span>
        <span style="font-weight:700;color:var(--primary)">${cnt}회</span>
      </div>
      <div style="height:5px;background:var(--bg);border-radius:3px;overflow:hidden">
        <div style="height:100%;width:${Math.round(cnt/maxPageCnt*100)}%;background:#3266AD;border-radius:3px"></div>
      </div>
    </div>`).join('');
}



function gradeToScore(g) {
  return {S:6, A:5, B:4, C:3, D:2, E:1}[g]||0;
}
function radarPoly(r, scores) {
  if (!scores) {
    return [0,1,2,3,4].map(i=>{const a=(i*72-90)*Math.PI/180;return `${Math.cos(a)*r},${Math.sin(a)*r}`;}).join(' ');
  }
  return scores.map((s,i)=>{const a=(i*72-90)*Math.PI/180;const r2=(s/7)*140;return `${Math.cos(a)*r2},${Math.sin(a)*r2}`;}).join(' ');
}
const radarActiveQuarters={};
const radarDataCache={};
const radarAvgMode={};   // { safeKey: true } 전체(평균) 모드 여부

async function toggleRadarQuarter(safeKey,q,sabun,name){
  if(!radarActiveQuarters[safeKey]) radarActiveQuarters[safeKey]={Q1:false,Q2:false,Q3:false,Q4:false};
  radarActiveQuarters[safeKey][q]=!radarActiveQuarters[safeKey][q];
  const btn=document.getElementById(`radar-btn-${safeKey}-${q}`);
  if(btn){const active=radarActiveQuarters[safeKey][q];btn.style.background=active?btn.dataset.color:'var(--bg)';btn.style.color=active?'#fff':'var(--text-muted)';btn.dataset.active=active;}
  updateRadarAllBtn(safeKey);
  await renderRadar(safeKey,sabun,name);
}
async function toggleAllRadar(safeKey,sabun,name){
  if(!radarActiveQuarters[safeKey]) radarActiveQuarters[safeKey]={Q1:false,Q2:false,Q3:false,Q4:false};
  const allOn=['Q1','Q2','Q3','Q4'].every(q=>radarActiveQuarters[safeKey][q]);
  const turnOn=!allOn; // 전부 켜져있으면 끄고, 아니면 전부 켜기(평균)
  ['Q1','Q2','Q3','Q4'].forEach(q=>{
    radarActiveQuarters[safeKey][q]=turnOn;
    const btn=document.getElementById(`radar-btn-${safeKey}-${q}`);
    if(btn){btn.style.background=turnOn?btn.dataset.color:'var(--bg)';btn.style.color=turnOn?'#fff':'var(--text-muted)';btn.dataset.active=turnOn;}
  });
  updateRadarAllBtn(safeKey);
  await renderRadar(safeKey,sabun,name);
}
function updateRadarAllBtn(safeKey){
  const aq=radarActiveQuarters[safeKey]||{};
  const allOn=['Q1','Q2','Q3','Q4'].every(q=>aq[q]);
  const allBtn=document.getElementById(`radar-all-btn-${safeKey}`);
  if(allBtn){allBtn.style.background=allOn?'var(--primary)':'var(--bg)';allBtn.style.color=allOn?'#fff':'var(--primary)';}
}

async function renderRadar(safeKey,sabun,name){
  const COLORS={Q1:'#3266AD',Q2:'#2E7D32',Q3:'#E65100',Q4:'#6A1B9A'};
  const LABELS={Q1:'1분기',Q2:'2분기',Q3:'3분기',Q4:'4분기'};
  const active=radarActiveQuarters[safeKey]||{};
  const year=radarSelectedYear[safeKey]||activeQuarter.year;
  const layers=document.getElementById(`radar-layers-${safeKey}`);
  const legend=document.getElementById(`radar-legend-${safeKey}`);
  const scorePanel=document.getElementById(`radar-score-panel-${safeKey}`);
  if(!layers) return;

  // 년도 미선택 안내
  if(!radarSelectedYear[safeKey]){
    if(scorePanel) scorePanel.innerHTML=`<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:12px">년도를 먼저 선택하세요</div>`;
    return;
  }

  const dataMap={};
  for(const q of ['Q1','Q2','Q3','Q4']){
    if(!active[q]) continue;
    const cKey=`${safeKey}_${q}`;
    if(!radarDataCache[cKey]){
      const docKey=`eval_${year}_${q}`;
      try{
        const doc=await db.collection('evalData').doc(docKey).get();
        radarDataCache[cKey]=doc.exists?doc.data().data:{};
      } catch(e){
        radarDataCache[cKey]=JSON.parse(localStorage.getItem(docKey)||'{}');
      }
      // 하드코딩 데이터 병합 (Firebase에 없는 항목만)
      if(eaAllData[docKey] && Object.keys(eaAllData[docKey]).length>0){
        Object.entries(eaAllData[docKey]).forEach(([no,d])=>{
          if(!radarDataCache[cKey][no]||!radarDataCache[cKey][no].g1){
            radarDataCache[cKey][no]=d;
          }
        });
      }
    }
    dataMap[q]=radarDataCache[cKey];
  }

  function findPerson(qData){
    if(!qData) return null;
    const p=persons.find(p=>(sabun&&p.sabun===sabun)||p.name===name);
    return p?(qData[p.no]||null):null;
  }

  layers.innerHTML='';
  const activeLegends=[];
  let lastData=null,lastQ=null;

  // 소속 가져오기 (hrPersons에서)
  const hrP = hrPersons.find(p=>(sabun&&(p['사번']||'').trim()===sabun)||(p['이름']||p['성명']||'').trim()===name);
  const bonbu = hrP ? (hrP['본부']||hrP['지점']||'') : '';
  const ITEMS = getEvalItems(year, bonbu);

  // 레이더 레이블 업데이트
  ITEMS.forEach((label,i)=>{
    const el=document.getElementById(`radar-label-${safeKey}-${i}`);
    if(el) el.textContent=label;
  });

  // ── 평균 모드: 활성 분기가 2개 이상이면(개별 다중선택·전체 모두) 역량별 평균 ──
  if(['Q1','Q2','Q3','Q4'].filter(q=>active[q]).length >= 2){
    function toNum(v){ const n=Number(v); return (!isNaN(n)&&n>0) ? n : gradeToScore(v)*100/6; }
    const perQ=[];
    for(const q of ['Q1','Q2','Q3','Q4']){
      if(!active[q]) continue;
      const d=findPerson(dataMap[q]);
      if(d) perQ.push(d);
    }
    layers.innerHTML='';
    if(perQ.length===0){
      if(legend) legend.innerHTML='';
      if(scorePanel) scorePanel.innerHTML=`<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:12px">평균을 낼 분기 데이터가 없습니다</div>`;
      return;
    }
    const avgScores=[0,1,2,3,4].map(i=>{
      const gk='g'+(i+1);
      const vals=perQ.map(d=>toNum(d[gk])).filter(s=>s>0);
      return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
    });
    const maxScore=100, color='#1a3a5c';
    const pts=avgScores.map((s,i)=>{const a=(i*72-90)*Math.PI/180;const r2=(s/maxScore)*150;return `${Math.cos(a)*r2},${Math.sin(a)*r2}`;}).join(' ');
    layers.innerHTML=`<polygon points="${pts}" fill="${color}" fill-opacity="0.15" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
      ${avgScores.map((s,i)=>{const a=(i*72-90)*Math.PI/180;const r2=(s/maxScore)*150;return `<circle cx="${Math.cos(a)*r2}" cy="${Math.sin(a)*r2}" r="3.5" fill="${color}" opacity="0.85"/>`;}).join('')}`;
    if(legend) legend.innerHTML=`<span style="display:inline-flex;align-items:center;gap:3px"><span style="width:9px;height:9px;border-radius:2px;background:${color};display:inline-block"></span><span style="font-size:11px;color:var(--text-muted)">평균 (${perQ.length}개 분기)</span></span>`;
    const okScores=avgScores.filter(s=>s>0);
    const avg=okScores.length?okScores.reduce((a,b)=>a+b,0)/okScores.length:0;
    const maxIdx=avgScores.indexOf(Math.max(...avgScores));
    const minIdx=avgScores.indexOf(Math.min(...(okScores.length?okScores:[0])));
    if(scorePanel) scorePanel.innerHTML=`
      <div style="background:var(--surface);border-radius:8px;padding:10px 12px;border:1px solid var(--border)">
        <div style="font-size:11px;font-weight:700;color:${color};margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--border)">${year}년 평균 <span style="font-weight:400;color:var(--text-muted)">(${perQ.length}개 분기)</span></div>
        ${ITEMS.map((item,i)=>{
          const numVal=avgScores[i];
          const dispVal=numVal>0?Math.round(numVal)+'점':'-';
          const dispColor=numVal>=90?'#c62828':numVal>=80?'#1565c0':numVal>=70?'#2e7d32':'var(--text)';
          return `<div style="display:flex;align-items:center;justify-content:space-between;padding:2px 0;${i<4?'border-bottom:1px solid #f0f2f5':''}">
            <span style="font-size:12px;color:var(--text-muted)">${item}</span>
            <span style="font-size:12px;font-weight:700;color:${dispColor}">${dispVal}</span>
          </div>`;
        }).join('')}
        <div style="display:flex;justify-content:space-between;margin-top:6px;padding-top:5px;border-top:2px solid ${color}33">
          <span style="font-size:11px;color:var(--text-muted)">평균</span>
          <span style="font-size:13px;font-weight:800;color:${color}">${Math.round(avg)}점</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:5px;border-top:1px solid var(--border);flex-wrap:wrap">
          <span style="font-size:11px;color:var(--text-muted)">강점</span>
          <span style="padding:2px 8px;border-radius:10px;background:#e8f5e9;color:#2e7d32;font-size:11px;font-weight:700">${ITEMS[maxIdx]}</span>
          <span style="font-size:11px;color:var(--text-muted);margin-left:2px">보완</span>
          <span style="padding:2px 8px;border-radius:10px;background:#fff3e0;color:#e65100;font-size:11px;font-weight:700">${ITEMS[minIdx]||'-'}</span>
        </div>
      </div>`;
    loadRadarComments(safeKey,sabun,name);
    return;
  }

  for(const q of ['Q1','Q2','Q3','Q4']){
    if(!active[q]) continue;
    const d=findPerson(dataMap[q]);
    if(!d) continue;
    // 점수: 숫자면 직접 사용, 등급이면 변환
    function toNum(v){ const n=Number(v); return (!isNaN(n)&&n>0) ? n : gradeToScore(v)*100/6; }
    const scores=[toNum(d.g1),toNum(d.g2),toNum(d.g3),toNum(d.g4),toNum(d.g5)];
    const maxScore=100;
    const color=COLORS[q];
    const pts=scores.map((s,i)=>{const a=(i*72-90)*Math.PI/180;const r2=(s/maxScore)*150;return `${Math.cos(a)*r2},${Math.sin(a)*r2}`;}).join(' ');
    layers.innerHTML+=`<polygon points="${pts}" fill="${color}" fill-opacity="0.15" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    ${scores.map((s,i)=>{const a=(i*72-90)*Math.PI/180;const r2=(s/maxScore)*150;return `<circle cx="${Math.cos(a)*r2}" cy="${Math.sin(a)*r2}" r="3.5" fill="${color}" opacity="0.85"/>`;}).join('')}`;
    activeLegends.push({q,color,label:LABELS[q]});
    lastData=d; lastQ=q;
  }

  if(legend) legend.innerHTML=activeLegends.map(({color,label})=>
    `<span style="display:inline-flex;align-items:center;gap:3px"><span style="width:9px;height:9px;border-radius:2px;background:${color};display:inline-block"></span><span style="font-size:11px;color:var(--text-muted)">${label}</span></span>`
  ).join('');

  if(!lastData){
    if(scorePanel) scorePanel.innerHTML=`<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:12px">분기 버튼을 클릭해서 역량을 확인하세요</div>`;
    return;
  }

  const grades=[lastData.g1,lastData.g2,lastData.g3,lastData.g4,lastData.g5];
  function toNum(v){ const n=Number(v); return (!isNaN(n)&&n>0) ? n : gradeToScore(v)*100/6; }
  const scores5=grades.map(toNum);
  const avg=scores5.filter(s=>s>0).reduce((a,b)=>a+b,0)/(scores5.filter(s=>s>0).length||1);
  const maxIdx=scores5.indexOf(Math.max(...scores5));
  const minIdx=scores5.indexOf(Math.min(...scores5.filter(s=>s>0)));
  const color=COLORS[lastQ];

  if(scorePanel) scorePanel.innerHTML=`
    <div style="background:var(--surface);border-radius:8px;padding:10px 12px;border:1px solid var(--border)">
      <div style="font-size:11px;font-weight:700;color:${color};margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--border)">${year}년 ${LABELS[lastQ]} 평가</div>
      ${ITEMS.map((item,i)=>{
        const rawVal = grades[i]||'-';
        const numVal = scores5[i];
        const dispVal = numVal>0 ? Math.round(numVal)+'점' : rawVal;
        const dispColor = numVal>=90?'#c62828':numVal>=80?'#1565c0':numVal>=70?'#2e7d32':'var(--text)';
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:2px 0;${i<4?'border-bottom:1px solid #f0f2f5':''}">
          <span style="font-size:12px;color:var(--text-muted)">${item}</span>
          <span style="font-size:12px;font-weight:700;color:${dispColor}">${dispVal}</span>
        </div>`;
      }).join('')}
      <div style="display:flex;justify-content:space-between;margin-top:6px;padding-top:5px;border-top:2px solid ${color}33">
        <span style="font-size:11px;color:var(--text-muted)">평균</span>
        <span style="font-size:13px;font-weight:800;color:${color}">${Math.round(avg)}점</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:5px;border-top:1px solid var(--border);flex-wrap:wrap">
        <span style="font-size:11px;color:var(--text-muted)">강점</span>
        <span style="padding:2px 8px;border-radius:10px;background:#e8f5e9;color:#2e7d32;font-size:11px;font-weight:700">${ITEMS[maxIdx]}</span>
        <span style="font-size:11px;color:var(--text-muted);margin-left:2px">보완</span>
        <span style="padding:2px 8px;border-radius:10px;background:#fff3e0;color:#e65100;font-size:11px;font-weight:700">${ITEMS[minIdx]||'-'}</span>
      </div>
    </div>`;

  loadRadarComments(safeKey,sabun,name);
}

async function loadRadarComments(safeKey,sabun,name){
  const person=persons.find(p=>(sabun&&p.sabun===sabun)||p.name===name);
  if(!person) return;
  for(let i=0;i<4;i++){
    const q=['Q1','Q2','Q3','Q4'][i];
    const docKey=`eval_${activeQuarter.year}_${q}`;
    const previewEl=document.getElementById(`comment-${safeKey}-${i}-preview`);
    const bodyEl=document.getElementById(`comment-body-${safeKey}-${i}`);
    if(!previewEl||!bodyEl) continue;
    let qData=radarDataCache[`${safeKey}_${q}`];
    if(!qData){
      try{const doc=await db.collection('evalData').doc(docKey).get();qData=doc.exists?doc.data().data:{};radarDataCache[`${safeKey}_${q}`]=qData;}
      catch(e){qData=JSON.parse(localStorage.getItem(docKey)||'{}');}
    }
    const d=qData[person.no];
    const comment=d?(d.comment||''):'';
    if(!comment){previewEl.textContent='서술 평가 없음';bodyEl.innerHTML='<span style="color:var(--text-muted)">해당 분기 서술 평가가 없습니다.</span>';}
    else{previewEl.textContent=comment.length>40?comment.slice(0,40)+'...':comment;bodyEl.textContent=comment;}
  }
}

function toggleComment(bodyId,arrowId){
  const body=document.getElementById(bodyId);
  const arrow=document.getElementById(arrowId);
  if(!body) return;

// ══ 분기 관리 ══
async function setActiveQuarter() {
  const y = parseInt(document.getElementById('aq-year').value);
  const q = parseInt(document.getElementById('aq-quarter').value);
  if (!confirm(`활성 분기를 ${y}년 ${q}분기로 변경하시겠습니까?\n\n변경 후 평가 입력이 새 분기로 전환됩니다.`)) return;
  activeQuarter = {year:y, quarter:q};
  try {
    await db.collection('system').doc('config').set({activeQuarter});
  } catch(e) { console.warn(e); }
  // 새 분기 evalData 로드
  evalData = await loadQuarterData(y, q);
  persons.forEach(p => {
    if (!evalData[p.no]) evalData[p.no] = {g1:'',g2:'',g3:'',g4:'',g5:'',comment:'',cGrade:'',done:false};
  });
  updateQuarterUI();
  renderAdminOverview();
  showToast(`✅ ${y}년 ${q}분기로 전환됐습니다.`);
}

function updateQuarterUI() {
  const badge = document.getElementById('aq-badge');
  if (badge) badge.textContent = `${activeQuarter.year}년 ${activeQuarter.quarter}분기 활성`;
  const ysel = document.getElementById('aq-year');
  const qsel = document.getElementById('aq-quarter');
  if (ysel) ysel.value = activeQuarter.year;
  if (qsel) qsel.value = activeQuarter.quarter;
  // 과거 분기 드롭다운 갱신
  const vsel = document.getElementById('view-quarter-sel');
  if (vsel) {
    vsel.innerHTML = '<option value="">현재 분기 보기</option>';
    const years = [2024,2025,2026,2027];
    years.forEach(y => {
      [1,2,3,4].forEach(q => {
        if (y < activeQuarter.year || (y===activeQuarter.year && q < activeQuarter.quarter)) {
          vsel.innerHTML += `<option value="${y}_${q}">${y}년 ${q}분기</option>`;
        }
      });
    });
  }
  // topbar 분기 표시 업데이트
  const sub = document.getElementById('topbar-sub');
  if (sub && currentUser) {
    const org = currentUser.role==='admin' ? '관리자' : (currentUser.bonbu||currentUser.jijum||'');
    sub.textContent = org;
  }
}

let viewingQuarterData = null; // 과거 분기 조회 중이면 해당 데이터
async function loadViewQuarter() {
  const sel = document.getElementById('view-quarter-sel');
  const val = sel ? sel.value : '';
  if (!val) {
    viewingQuarterData = null;
    renderAdminOverview();
    renderResult();
    showToast('현재 분기로 돌아왔습니다.');
    return;
  }
  const [y, q] = val.split('_').map(Number);
  showToast(`${y}년 ${q}분기 데이터 불러오는 중...`);
  viewingQuarterData = await loadQuarterData(y, q);
  renderAdminOverview();
  renderResult();
  showToast(`✅ ${y}년 ${q}분기 조회 중`);
}

// 현재 화면에서 쓸 evalData (조회 모드면 과거 데이터)
function getDisplayEvalData() {
  return viewingQuarterData || evalData;
}

// ══ CSV EXPORT ══
function exportCSV(){
  let rows=['순번,이름,직책,직책년차,담당평가자,점수,등급,인센티브,서술등급,상태'];
  persons.forEach((p,i)=>{
    const d=evalData[p.no]||{}; const score=calcScore(d); const grade=calcGrade(score);
    const incv=score!==null?isIncentive(grade,p.nyeoncha)?'지급':'미지급':'미평가';
    rows.push(`${i+1},${p.name},${p.jikchek},${p.nyeoncha},${getEvaluatorName(p.evaluatorId)},${score||''},${grade||''},${incv},${d.cGrade||''},${d.done?'완료':'미완료'}`);
  });
  const blob=new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='26년1분기직책자평가결과.csv'; a.click();
  showToast('📥 CSV 파일 다운로드 완료');
}

function toggleHrIncluded(sabun, name, checked) {
  // hrPersons에서 해당 인원 찾기 (사번 또는 이름 기준)
  let hrP = hrPersons.find(h =>
    (sabun && (h['사번']||'').toString().trim() === sabun) ||
    ((h['이름']||h['성명']||'').trim() === name)
  );

  if (checked) {
    // 포함 체크 → hrPersons에 없으면 추가
    if (!hrP) {
      const p = persons.find(p => (sabun && p.sabun===sabun) || p.name===name);
      const a = accounts.find(a => a.id===sabun || a.name===name);
      hrPersons.push({
        '사번':   sabun || '',
        '이름':   name  || '',
        '회사':   p?.company  || '',
        '본부':   p?.bonbu    || a?.bonbu || '',
        '지점':   p?.jijum    || '',
        '실':     p?.sil      || '',
        '팀':     p?.team     || '',
        '직책':   p?.jikchek  || a?.position || '',
        '직책급': p?.jikchekgup || '',
        '직급':   p?.jikgup   || '',
        '이메일': p?.email    || '',
        '직책년차': p?.nyeoncha || '',
      });
    }
  } else {
    // 해제 → hrPersons에서 제거
    if (hrP) {
      hrPersons = hrPersons.filter(h => h !== hrP);
    }
  }
  save();
  renderMembersAdmin();
  showToast(checked ? `✅ ${name} 인적사항 포함` : `❌ ${name} 인적사항 제외`);
}

// 과거 평가 업로드 (인원통합관리용)
function updatePastEvalBadgeM() {

  const q = document.getElementById('past-eval-quarter-m')?.value;
  const badge = document.getElementById('past-eval-target-badge-m');
  if (badge && y && q) badge.textContent = `→ eval_${y}_Q${q}`;
}
function pastEvalDropM(e) {

  const file = e.dataTransfer.files[0]; if (file) pastEvalProcessM(file);
}
function pastEvalUploadM(e) {
  const file = e.target.files[0]; if (file) pastEvalProcessM(file); e.target.value='';
}
async function pastEvalProcessM(file) {
  const year    = document.getElementById('past-eval-year-m')?.value;
  const quarter = document.getElementById('past-eval-quarter-m')?.value;
  if (!year || !quarter) { showToast('년도와 분기를 먼저 선택해주세요.'); return; }
  const docKey = `eval_${year}_Q${quarter}`;
  hrSetResult('r-past-eval-m', 'info', '⏳ 처리 중...');
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const wb = XLSX.read(ev.target.result, {type:'binary'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      if (rows.length < 2) { hrSetResult('r-past-eval-m','warn','데이터가 없습니다.'); return; }
      const headers = rows[0].map(h=>String(h).trim());
      const sabunIdx   = headers.findIndex(h=>h==='사번');
      const nameIdx    = headers.findIndex(h=>h==='이름');
      const commentIdx = headers.findIndex(h=>h.startsWith('서술'));
      const fixedCols  = new Set([sabunIdx, nameIdx, commentIdx].filter(i=>i>=0));
      const gCols      = headers.map((_,i)=>i).filter(i=>!fixedCols.has(i)).slice(0,5);
      function parseScore(v) {
        const s = String(v||'').trim().toUpperCase();
        if (s==='') return '';
        const n = Number(s); if (!isNaN(n) && n>0) return n;
        return ({S:100,A:90,B:80,C:70,D:60,E:50}[s] ?? '');
      }
      let existing = {};
      try { const doc = await db.collection('evalData').doc(docKey).get(); existing = doc.exists?(doc.data().data||{}):{};
      } catch(e) { existing = JSON.parse(localStorage.getItem(docKey)||'{}'); }
      let ok=0, skip=0;
      for (let i=1;i<rows.length;i++) {
        const r=rows[i]; if(r.every(c=>c==='')) continue;
        const sabun=sabunIdx>=0?String(r[sabunIdx]||'').trim():'';
        const name =nameIdx>=0 ?String(r[nameIdx] ||'').trim():'';
        const person=persons.find(p=>(sabun&&p.sabun===sabun)||(name&&p.name===name));
        if(!person){skip++;continue;}
        existing[person.no]={...(existing[person.no]||{}),
          g1:parseScore(r[gCols[0]]),g2:parseScore(r[gCols[1]]),g3:parseScore(r[gCols[2]]),
          g4:parseScore(r[gCols[3]]),g5:parseScore(r[gCols[4]]),
          comment:commentIdx>=0?String(r[commentIdx]||'').trim():'',
          updatedAt:new Date().toISOString()};
        ok++;
      }
      try { await db.collection('evalData').doc(docKey).set({data:existing},{merge:true}); } catch(e){}
      localStorage.setItem(docKey, JSON.stringify(existing));
      hrSetResult('r-past-eval-m','ok',`✅ ${docKey} 업로드 완료 · ${ok}명 반영 · ${skip}명 미매칭`);
    } catch(err) { hrSetResult('r-past-eval-m','warn','오류: '+err.message); }
  };
  reader.readAsBinaryString(file);
}

// 사진 인라인 업로드 (인원통합관리 목록 내)
function hrPhotoUploadInline(e, encKey, labelEl) {
  const key  = decodeURIComponent(encKey);
  const file = e.target.files[0]; if(!file) return;
  if(labelEl) labelEl.innerHTML = '<span style="font-size:10px;color:var(--text-muted)">⏳...</span>';
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = async () => {
      const MAX_W=300, MAX_H=400;
      let w=img.width, h=img.height;
      if (w/h > MAX_W/MAX_H) { w=MAX_W; h=Math.round(img.height*MAX_W/img.width); }
      else { h=MAX_H; w=Math.round(img.width*MAX_H/img.height); }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const blob = await new Promise(res=>canvas.toBlob(res,'image/jpeg',0.85));
      const path = `photos/${key}/photo.jpg`;
      const ref  = storage.ref(path);
      try {
        await ref.put(blob, {contentType:'image/jpeg'});
        const url = await ref.getDownloadURL();
        if (!hrExtra[key]) hrExtra[key]={};
        hrExtra[key].photo = url;
        await db.collection('hrExtra').doc(key).set({photo:url},{merge:true});
        localStorage.setItem('hr_extra', JSON.stringify(hrExtra));
        showToast('✅ 사진 업로드 완료');
        renderMembersAdmin();
      } catch(err) { showToast('사진 업로드 실패: '+err.message); }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

}

  };
  reader.readAsDataURL(file);

// 실 전환 시: 아래 함수 본문을 Claude API 호출(서버 경유)로 바꾸면 됨
function analyzeTalentEssays(){
  const withEssay = TALENT_PEOPLE.filter(p=>p.essay);
  // 주제별 키워드 집계
  const topicKw={}; // topic -> {kw:count}
  withEssay.forEach(p=>{const tk=p.essay.topic;topicKw[tk]=topicKw[tk]||{};p.essay.keywords.forEach(k=>topicKw[tk][k]=(topicKw[tk][k]||0)+1);});
  // 공통 vs 고유: 등장 주제 수
  const kwTopics={};Object.entries(topicKw).forEach(([tk,m])=>Object.keys(m).forEach(k=>{(kwTopics[k]=kwTopics[k]||new Set()).add(tk);}));
  const common=Object.entries(kwTopics).filter(([k,s])=>s.size>=2).map(([k,s])=>({kw:k,topics:s.size})).sort((a,b)=>b.topics-a.topics);
  // AI 도구/단계/레벨 집계
  const toolCnt={},stageCnt={},levelDist=[0,0,0,0,0];
  withEssay.forEach(p=>{p.essay.ai.tools.forEach(t=>toolCnt[t]=(toolCnt[t]||0)+1);
    p.essay.ai.stages.forEach(s=>stageCnt[s]=(stageCnt[s]||0)+1);
    levelDist[(p.essay.ai.level||1)-1]++;});
  const avgLevel=withEssay.length?(withEssay.reduce((s,p)=>s+p.essay.ai.level,0)/withEssay.length):0;
  return {withEssay,topicKw,common,toolCnt,stageCnt,levelDist,avgLevel,count:withEssay.length};
}

function renderTalentFiles(name,baseOutputs){
  const ups=talentUploads[name]||[];
  const all=[...(baseOutputs||[]).map(o=>({...o,sample:true})),...ups];
  if(!all.length)return '<div class="tl-placeholder" style="margin-bottom:10px">첨부된 산출물이 없습니다.</div>';
  return all.map((f,i)=>`<div class="tl-file" ${f.url?`onclick="window.open('${f.url}','_blank')"`:''}>
    <span class="ic">${TL_FILE_IC[f.type]||'📎'}</span>
    <span style="font-weight:600">${f.name}</span>
    ${f.sample?'<span class="badge badge-gold" style="font-size:9px;margin-left:6px">샘플</span>':''}
    <span class="meta">${f.size||''}${f.url?' · 열기':''}</span>
  </div>`).join('');
}
function talentAddFiles(encName,ev){
  const name=decodeURIComponent(encName);
  const files=[...ev.target.files];if(!files.length)return;
  talentUploads[name]=talentUploads[name]||[];
  let pending=files.length;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const ext=(file.name.split('.').pop()||'').toLowerCase();
      const type=['jpg','jpeg','png','gif','webp'].includes(ext)?'img':ext;
      talentUploads[name].push({name:file.name,type,size:(file.size/1024).toFixed(0)+'KB',url:reader.result});
      if(--pending===0){
        const baseOutputs=(TALENT_PEOPLE.find(x=>x.name===name)?.essay?.ai?.outputs)||[];
        const box=document.getElementById('tl-files-'+encName);if(box)box.innerHTML=renderTalentFiles(name,baseOutputs);
      }
    };
    reader.readAsDataURL(file);
  });
  ev.target.value='';
}
